[package]
name = "ray"
version = "0.1.2"
description = "Ray: fast, clean dictation for Windows"
authors = ["Helion"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "ray_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
futures-util = "0.3"
bytes = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls", "system-proxy", "stream"] }
cpal = "0.18"
arboard = { version = "3", features = ["image-data"] }
keyring = { version = "3.6", features = ["windows-native"] }
url = "2"
winreg = "0.55"
rand = "0.10"
sha2 = "0.10"
base64 = "0.23"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
strip = true
opt-level = "s"
lto = "thin"
codegen-units = 1
