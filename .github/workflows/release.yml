name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [patch, minor, major]
        default: patch

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Build in a read-only job with no credentials. Nothing here can write to the
  # repository, and no signing key or token is exposed to the compiler or to
  # pnpm scripts.
  build:
    # A release commit must not start another release. Pushes made with
    # GITHUB_TOKEN do not retrigger workflows; keeping the marker in the
    # message also covers manual runs and a future PAT.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
      !contains(github.event.head_commit.message, '[skip release]'))
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      base: ${{ steps.base.outputs.sha }}
    steps:
      # Build the current tip of main, not the sha that triggered the run.
      # Runs are serialized by the concurrency group, so a queued run starts
      # after an earlier run may already have pushed a version bump; pinning
      # github.sha would rebuild the same version and lose the push race.
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Record the release base
        id: base
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="$(git rev-parse HEAD)"
          if [ "$BASE_SHA" != "$(git rev-parse origin/main)" ]; then
            echo "Checkout is not at the tip of main." >&2
            exit 1
          fi
          echo "sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "Release base: $BASE_SHA"

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Bump version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node scripts/bump-version.mjs "${{ inputs.bump || 'patch' }}")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Ray v$VERSION"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build without updater artifacts: creating them needs the signing key,
      # which this job must not have. The publish job signs the installer.
      - name: Build installer
        shell: bash
        run: pnpm tauri build -c '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Validate the build
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          installers=(src-tauri/target/release/bundle/nsis/*-setup.exe)
          if [ "${#installers[@]}" -ne 1 ]; then
            echo "Expected exactly one NSIS installer, found ${#installers[@]}." >&2
            exit 1
          fi
          INSTALLER="${installers[0]}"
          if [ ! -s "$INSTALLER" ]; then
            echo "Installer $INSTALLER is empty." >&2
            exit 1
          fi
          if [[ "$(basename "$INSTALLER")" != *"$VERSION"* ]]; then
            echo "Installer name $(basename "$INSTALLER") does not contain version $VERSION." >&2
            exit 1
          fi
          node -e '
          const fs = require("node:fs");
          const expected = process.env.VERSION;
          const found = {
            "package.json": JSON.parse(fs.readFileSync("package.json", "utf8")).version,
            "src-tauri/tauri.conf.json": JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json", "utf8")).version,
            "src-tauri/Cargo.toml": /\[package\][\s\S]*?^version = "([^"]+)"/m.exec(fs.readFileSync("src-tauri/Cargo.toml", "utf8"))?.[1],
            "src-tauri/Cargo.lock": /\[\[package\]\]\r?\nname = "ray"\r?\nversion = "([^"]+)"/.exec(fs.readFileSync("src-tauri/Cargo.lock", "utf8"))?.[1],
          };
          for (const [file, version] of Object.entries(found)) {
            if (version !== expected) {
              console.error(`${file} is at ${version ?? "an unknown version"}, expected ${expected}.`);
              process.exit(1);
            }
          }
          console.log(`All version files are at ${expected}.`);
          '

      - uses: actions/upload-artifact@v4
        with:
          name: release
          if-no-files-found: error
          retention-days: 7
          path: |
            package.json
            src-tauri/tauri.conf.json
            src-tauri/Cargo.toml
            src-tauri/Cargo.lock
            src-tauri/target/release/bundle/nsis/*-setup.exe

  # The only job with write access. It commits the bump without pushing it,
  # signs the installer, and publishes only after both succeeded.
  publish:
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      # Check out the tip of main and require it to be the exact commit the
      # build used. If main advanced during the build, these artifacts belong
      # to an older commit and must not be committed, tagged, or published.
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Verify the release base is still current
        shell: bash
        env:
          BASE_SHA: ${{ needs.build.outputs.base }}
        run: |
          set -euo pipefail
          CURRENT_SHA="$(git rev-parse HEAD)"
          if [ "$CURRENT_SHA" != "$BASE_SHA" ]; then
            echo "main moved from $BASE_SHA to $CURRENT_SHA while the release was building." >&2
            echo "These artifacts belong to the old commit, so nothing will be committed or published." >&2
            echo "A push to main queues a fresh run; otherwise re-run the Release workflow." >&2
            exit 1
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/download-artifact@v4
        with:
          name: release
          path: .

      # The artifact crossed a trust boundary: the build job is credential-free
      # but its scripts could have been tampered with. Check that the download
      # changes only the version declarations before committing anything.
      - name: Verify the downloaded bump
        shell: bash
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: node scripts/verify-bump.mjs "$VERSION"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Commit here but do not push: the bump must not land on main unless the
      # build, the signature, and latest.json all succeed.
      - name: Commit the version bump
        id: commit
        shell: bash
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock
          git commit -m "chore: release v${VERSION} [skip release]"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # requireSignedVersion means the trusted comment must carry this version,
      # hence --app-version rather than signing whatever the build emitted.
      - name: Sign the installer
        shell: bash
        env:
          VERSION: ${{ needs.build.outputs.version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          installers=(src-tauri/target/release/bundle/nsis/*-setup.exe)
          if [ "${#installers[@]}" -ne 1 ]; then
            echo "Expected exactly one NSIS installer, found ${#installers[@]}." >&2
            exit 1
          fi
          INSTALLER="${installers[0]}"
          pnpm tauri signer sign --app-version "$VERSION" "$INSTALLER"
          if [ ! -s "${INSTALLER}.sig" ]; then
            echo "Signing did not produce ${INSTALLER}.sig." >&2
            exit 1
          fi

      - name: Write latest.json
        shell: bash
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          installers=(src-tauri/target/release/bundle/nsis/*-setup.exe)
          INSTALLER="${installers[0]}"
          node scripts/latest-json.mjs "$VERSION" "$INSTALLER" "$GITHUB_REPOSITORY" "v$VERSION" > latest.json
          cat latest.json

      # Push only after the build, the signature, and latest.json succeeded.
      # The credential goes on the remote for this one push and is removed
      # again, even if the push fails.
      - name: Push the version commit
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_SHA: ${{ needs.build.outputs.base }}
        run: |
          set -euo pipefail
          auth_remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          public_remote="https://github.com/${GITHUB_REPOSITORY}.git"
          git remote set-url origin "$auth_remote"
          trap 'git remote set-url origin "$public_remote"' EXIT
          # Signing took time too; re-check the tip right before pushing so a
          # push that landed meanwhile can never be raced or overwritten, and
          # the failure names the exact problem instead of a bare rejection.
          git fetch --no-tags --depth=1 origin main
          CURRENT_SHA="$(git rev-parse FETCH_HEAD)"
          if [ "$CURRENT_SHA" != "$BASE_SHA" ]; then
            echo "main moved from $BASE_SHA to $CURRENT_SHA after the build; these artifacts are stale." >&2
            echo "Nothing was pushed. A push to main queues a fresh run; otherwise re-run the Release workflow." >&2
            exit 1
          fi
          git push origin HEAD:main
          git remote set-url origin "$public_remote"
          trap - EXIT

      # Tag the bump commit itself, not the pre-bump checkout base.
      - name: Publish the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
          COMMIT_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          shopt -s nullglob
          installers=(src-tauri/target/release/bundle/nsis/*-setup.exe)
          INSTALLER="${installers[0]}"
          NOTES="Ray ${VERSION} for Windows.

          Press your dictation shortcut (Right Alt by default), speak, press it again. Ray updates itself; run the setup file below for a fresh install."
          # The push step ran first, so COMMIT_SHA is on main. Attach assets
          # only to a tag that names that same commit: the installer, the
          # version commit, the tag, and the release must agree.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            TAG_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${TAG}" --jq .sha 2>/dev/null || true)"
            if [ "$TAG_SHA" != "$COMMIT_SHA" ]; then
              echo "Release $TAG points at ${TAG_SHA:-an unknown commit}, not at ${COMMIT_SHA}; refusing to upload mismatched artifacts." >&2
              exit 1
            fi
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
              "$INSTALLER" "${INSTALLER}.sig" latest.json
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --target "$COMMIT_SHA" \
              --title "Ray $VERSION" \
              --notes "$NOTES" \
              "$INSTALLER" "${INSTALLER}.sig" latest.json
          fi
